<div style="flex:1"><div style="position:relative;height:80px"><div class="tabbar biztab" style="left:0;right:0;bottom:8px">${[['grid','Обзор'],['calendar','События'],['chart','Аудитория'],['chat','Сообщения'],['gear','Настройки']].map(([i,l],k)=>`<div class="tab ${k===0?'on':''}">${ic(i)}<span>${l}</span></div>`).join('')}</div></div><div class="c2" style="margin-top:0">Таб-бар бизнеса · та же форма, активная вкладка лаймовая — режим отличим сразу</div>
